<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Чат</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#fff;font-family:-apple-system,system-ui,sans-serif}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #222}
header h1{font-size:18px;font-weight:600}
.icon-btn{background:none;border:none;color:#fff;font-size:20px;padding:6px;cursor:pointer}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.user{align-self:flex-end;background:#fff;color:#000}
.bot{align-self:flex-start;background:#161616;border:1px solid #2a2a2a}
.bot img{display:block;max-width:100%;border-radius:10px;margin-top:6px}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{background:#fff;color:#000;border:none;border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
.btn.outline{background:none;color:#fff;border:1px solid #444}
#modes{display:flex;justify-content:space-around;padding:6px 8px;border-top:1px solid #222}
.mode{background:none;border:none;color:#777;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;cursor:pointer}
.mode .ic{font-size:22px}
.mode.active{color:#e10600}
form{display:flex;gap:8px;padding:10px;border-top:1px solid #222;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
textarea{flex:1;background:#111;color:#fff;border:1px solid #333;border-radius:14px;padding:10px 12px;font-size:16px;resize:none;max-height:120px;font-family:inherit}
#send{background:#e10600;color:#fff;border:none;border-radius:14px;padding:0 16px;font-size:16px;cursor:pointer}
#send:disabled{opacity:.4}
dialog{background:#0a0a0a;color:#fff;border:1px solid #333;border-radius:14px;width:92%;max-width:420px}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog label{display:block;font-size:13px;color:#aaa;margin:8px 0 4px}
dialog input{width:100%;background:#111;color:#fff;border:1px solid #333;border-radius:8px;padding:10px;font-size:15px}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
dialog p{font-size:13px;color:#888;line-height:1.4}
.preview{width:96vw;max-width:none;height:92dvh}
.preview iframe{width:100%;height:calc(92dvh - 70px);border:1px solid #333;border-radius:10px;background:#fff;margin-top:8px}
.preview .row{margin-top:8px}
</style>
</head>
<body>
<header>
  <button class="icon-btn" id="clear" title="Очистить">⟲</button>
  <h1>Чат</h1>
  <button class="icon-btn" id="settingsBtn" title="Настройки">⚙</button>
</header>

<div id="messages"></div>

<nav id="modes">
  <button class="mode active" data-mode="chat"><span class="ic">✎</span>Чат</button>
  <button class="mode" data-mode="presentation"><span class="ic">▦</span>Презентация</button>
  <button class="mode" data-mode="site"><span class="ic">◧</span>Сайт</button>
  <button class="mode" data-mode="image"><span class="ic">◉</span>Картинка</button>
</nav>

<form id="form">
  <textarea id="input" rows="1" placeholder="Напиши сообщение..."></textarea>
  <button id="send" type="submit">→</button>
</form>

<dialog id="settings">
  <label for="url">Адрес сервера (Ollama)</label>
  <input id="url" placeholder="http://192.168.1.10:11434">
  <label for="model">Модель</label>
  <input id="model" placeholder="llama3.1">
  <p style="margin-top:10px">Ollama бесплатна и работает на твоём ПК без токенов. Чтобы телефон достучался до ПК, на ПК задай переменную OLLAMA_HOST=0.0.0.0 и OLLAMA_ORIGINS=* и открой то же Wi-Fi.</p>
  <div class="row">
    <button class="btn outline" id="cancelSettings" type="button">Отмена</button>
    <button class="btn" id="saveSettings" type="button">Сохранить</button>
  </div>
</dialog>

<dialog id="preview" class="preview">
  <div class="row" style="justify-content:space-between;margin:0">
    <strong>Превью</strong>
    <div style="display:flex;gap:8px">
      <button class="btn outline" id="download" type="button">Скачать .html</button>
      <button class="btn" id="closePreview" type="button">Закрыть</button>
    </div>
  </div>
  <iframe id="frame" sandbox="allow-scripts"></iframe>
</dialog>

<script>
const SYSTEM = {
  chat: `Ты полезный ассистент. Отвечай по-русски, если пользователь не пишет на другом языке.
Отвечай по существу: сначала главный ответ, потом детали. Без вступлений вроде «Отличный вопрос» и без повторения вопроса.
Для длинных ответов используй короткие абзацы, заголовки и списки. Для простых вопросов отвечай коротко.
Не выдумывай факты, цифры, ссылки и названия. Если не уверен или данные могут устареть, прямо скажи об этом.
Если запрос неясен, сделай разумное допущение и укажи его, либо задай один уточняющий вопрос.
Код пиши в блоках с указанием языка и кратко объясняй, что он делает и что проверить.
Если пользователь просит что-то, что может навредить людям, объясни отказ коротко и предложи безопасную альтернативу.`,
  presentation: "Создай презентацию одним HTML-файлом: слайды во весь экран, переключение стрелками клавиатуры и свайпом, чёрно-белый дизайн с красным акцентом (#e10600). Весь код оберни в блок ```html.",
  site: "Создай одностраничный сайт одним HTML-файлом со встроенными CSS и JS, адаптивный под телефон, чёрно-белый дизайн с красным акцентом (#e10600). Весь код оберни в блок ```html."
};

const $ = id => document.getElementById(id);
const msgs = $('messages');
let mode = 'chat';
let history = [];
let cfg = JSON.parse(localStorage.getItem('chatCfg') || '{"url":"http://localhost:11434","model":"llama3.1"}');

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  div.textContent = text;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function renderBot(text) {
  const div = addMsg('bot', '');
  const match = text.match(/```html\s*([\s\S]*?)```/);
  if (!match) { div.textContent = text; return; }
  const code = match[1];
  const before = text.slice(0, match.index).trim();
  div.textContent = before || 'Готово.';
  const row = document.createElement('div');
  row.className = 'actions';
  const open = document.createElement('button');
  open.className = 'btn';
  open.textContent = mode === 'presentation' ? 'Открыть презентацию' : 'Открыть сайт';
  open.onclick = () => showPreview(code);
  const dl = document.createElement('button');
  dl.className = 'btn outline';
  dl.textContent = 'Скачать .html';
  dl.onclick = () => download(code);
  row.append(open, dl);
  div.appendChild(row);
}

function showPreview(code) {
  $('frame').srcdoc = code;
  $('preview').showModal();
  $('preview').dataset.code = code;
}

function download(code) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([code], { type: 'text/html' }));
  a.download = (mode === 'presentation' ? 'presentation' : 'site') + '.html';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function makeImage(prompt) {
  const div = addMsg('bot', '');
  const img = document.createElement('img');
  img.alt = prompt;
  img.onerror = () => { div.textContent = 'Не удалось получить картинку. Попробуй ещё раз или другой запрос.'; };
  img.src = 'https://image.pollinations.ai/prompt/' + encodeURIComponent(prompt) + '?width=768&height=768&nologo=true&seed=' + Date.now();
  div.appendChild(img);
}

async function ask(text) {
  addMsg('user', text);
  if (mode === 'image') {
    makeImage(text);
    return;
  }
  history.push({ role: 'user', content: text });
  const wait = addMsg('bot', '...');
  $('send').disabled = true;
  try {
    const res = await fetch(cfg.url.replace(/\/$/, '') + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: cfg.model,
        stream: false,
        messages: [{ role: 'system', content: SYSTEM[mode] }, ...history.slice(-20)]
      })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const reply = data.message.content;
    history.push({ role: 'assistant', content: reply });
    wait.remove();
    renderBot(reply);
  } catch (e) {
    wait.textContent = 'Не удалось связаться с сервером (' + e.message + '). Проверь адрес в настройках ⚙';
  } finally {
    $('send').disabled = false;
  }
}

$('form').addEventListener('submit', e => {
  e.preventDefault();
  const text = $('input').value.trim();
  if (!text) return;
  $('input').value = '';
  ask(text);
});

$('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 768) {
    e.preventDefault();
    $('form').requestSubmit();
  }
});

document.querySelectorAll('.mode').forEach(btn => {
  btn.onclick = () => {
    mode = btn.dataset.mode;
    document.querySelectorAll('.mode').forEach(b => b.classList.toggle('active', b === btn));
  };
});

$('clear').onclick = () => {
  history = [];
  msgs.innerHTML = '';
};

$('settingsBtn').onclick = () => {
  $('url').value = cfg.url;
  $('model').value = cfg.model;
  $('settings').showModal();
};
$('cancelSettings').onclick = () => $('settings').close();
$('saveSettings').onclick = () => {
  cfg = { url: $('url').value.trim() || cfg.url, model: $('model').value.trim() || cfg.model };
  localStorage.setItem('chatCfg', JSON.stringify(cfg));
  $('settings').close();
};

$('closePreview').onclick = () => $('preview').close();
$('download').onclick = () => download($('preview').dataset.code || '');
</script>
</body>
</html>
